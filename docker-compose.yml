services:
  # Backend Server
  server:
    image: socialapp-server:latest
    container_name: socialapp-server
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - ENV=production
      - JWT_SECRET=${JWT_SECRET}
      - DSN=${DSN}
      - CLOUDINARY_URL=${CLOUDINARY_URL}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URL=${GOOGLE_REDIRECT_URL}
      - RECAPTCHA_SECRET_KEY=${RECAPTCHA_SECRET_KEY}
      - MAILTRAP_TOKEN=${MAILTRAP_TOKEN}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
    restart: unless-stopped
    networks:
      - socialapp-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Client
  client:
    image: socialapp-client:latest
    container_name: socialapp-client
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://maqsatto.tech/api
        - VITE_WS_URL=ws://maqsatto.tech/ws
        - VITE_GOOGLE_CLIENT_ID=78805272321-hh7q631f2pj8ljv4rm6fvtoet9rguho1.apps.googleusercontent.com
        - VITE_RECAPTCHA_SITE_KEY=6LdE4Q0sAAAAAJK7dB03Q2S0CfdJe1A3yQ3x0p_m
    ports:
      - "8081:80"
    depends_on:
      - server
    restart: unless-stopped
    networks:
      - socialapp-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  socialapp-network:
    driver: bridge
